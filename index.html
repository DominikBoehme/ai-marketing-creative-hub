<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Creative Hub umgezogen</title>
  <meta http-equiv="refresh" content="0; url=https://scout24-creative-ops.github.io/creative-hub/" />
  <link rel="canonical" href="https://scout24-creative-ops.github.io/creative-hub/" />
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f1ea;
      --card: #fffdf9;
      --text: #2f2f2f;
      --muted: #6a675f;
      --link: #0057b8;
      --border: #ddd6ca;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: linear-gradient(180deg, #f7f3ec 0%, var(--bg) 100%);
      color: var(--text);
      font: 16px/1.5 Arial, Helvetica, sans-serif;
    }

    main {
      width: min(100%, 640px);
      padding: 32px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--card);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin: 0 0 12px;
      font-size: 32px;
      line-height: 1.15;
    }

    p {
      margin: 0 0 16px;
      color: var(--muted);
    }

    a {
      color: var(--link);
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main>
    <h1>Der Creative Hub ist umgezogen.</h1>
    <p>Du wirst automatisch zur neuen Creative-Hub-Seite weitergeleitet.</p>
    <p>Falls die automatische Weiterleitung nicht funktioniert, nutze bitte diesen Link:</p>
    <p><a href="https://scout24-creative-ops.github.io/creative-hub/">https://scout24-creative-ops.github.io/creative-hub/</a></p>
  </main>
</body>
</html>
